name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build (artifacts only)
        type: choice
        default: all
        options: [all, windows, macos]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      platform: ${{ steps.version.outputs.platform }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Validate platform versions and release tag
        shell: bash
        env:
          INPUT_PLATFORM: ${{ inputs.platform || 'all' }}
        run: bash .github/scripts/release-version.sh
      - name: Test release routing
        run: python3 tests/release_version_test.py
      - name: Test history retention
        run: |
          cc -std=c11 -Wall -Wextra -Werror tests/history_test.c common/audio_events.c -lm -o history-test
          ./history-test

  windows:
    needs: version
    if: needs.version.outputs.platform != 'macos'
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM-MinGW
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'llvm-mingw.zip'
          Invoke-WebRequest 'https://github.com/mstorsjo/llvm-mingw/releases/download/20260616/llvm-mingw-20260616-ucrt-x86_64.zip' -OutFile $archive
          $expected = 'b9b68a4d276e16fa25802aaba458e4638f64b3884c290aaccdc2d87083b6ca35'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $expected) { throw 'Toolchain checksum mismatch.' }
          7z x $archive "-o$env:RUNNER_TEMP" -y -bso0 -bsp0
          if ($LASTEXITCODE -ne 0) { throw 'Toolchain extraction failed.' }
      - name: Build and verify
        shell: pwsh
        run: ./windows/build.ps1 -Arch '${{ matrix.arch }}' -Toolchain "$env:RUNNER_TEMP/llvm-mingw-20260616-ucrt-x86_64"
      - name: Test native history list
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/llvm-mingw-20260616-ucrt-x86_64/bin/x86_64-w64-mingw32-clang.exe" -std=c11 -Wall -Wextra -Werror tests/windows_history_test.c windows/history_window.c common/audio_events.c -lcomctl32 -lgdi32 -luser32 -lm -o build/history-window-test.exe
          if ($LASTEXITCODE -ne 0) { throw 'History window test compilation failed.' }
          & ./build/history-window-test.exe
          if ($LASTEXITCODE -ne 0) { throw 'History window test failed.' }
      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path build/AudioTrace.exe -DestinationPath 'build/AudioTrace-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}.zip' -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: build/AudioTrace-*.zip
          if-no-files-found: error
          compression-level: 0

  macos:
    needs: version
    if: needs.version.outputs.platform != 'windows'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Test native history table
        run: |
          mkdir -p build
          xcrun clang -std=c11 -fobjc-arc -mmacosx-version-min=14.2 -Wall -Wextra -Werror tests/macos_history_test.m macos/HistoryWindow.m common/audio_events.c -framework AppKit -o build/history-window-test
          ./build/history-window-test
      - name: Build and verify
        run: |
          bash macos/build.sh '${{ matrix.arch }}'
          binary=build/AudioTrace.app/Contents/MacOS/AudioTrace
          test "$(xcrun lipo -archs "$binary")" = '${{ matrix.arch }}'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/AudioTrace.app/Contents/Info.plist)" = '${{ needs.version.outputs.version }}'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' build/AudioTrace.app/Contents/Info.plist)" = '${{ needs.version.outputs.version }}'
      - name: Verify disk image
        run: |
          bash tests/macos_package_test.sh 'build/AudioTrace-${{ needs.version.outputs.version }}-macos-${{ matrix.arch }}.dmg' '${{ matrix.arch }}' '${{ needs.version.outputs.version }}'
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: build/AudioTrace-*.dmg
          if-no-files-found: error
          compression-level: 0

  release:
    if: >-
      always() && !cancelled() && github.event_name == 'push' &&
      needs.version.result == 'success' &&
      needs.windows.result == 'success' &&
      needs.macos.result == 'success'
    needs: [version, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        working-directory: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          assets=(AudioTrace-*.zip AudioTrace-*.dmg)
          gh release create "$TAG" "${assets[@]}" --verify-tag --title "AudioTrace $version" --generate-notes
